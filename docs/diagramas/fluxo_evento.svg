<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b2e24"/>
    </marker>
    <style>
      .titulo { font-size: 26px; font-weight: 700; fill: #0b2e24; }
      .sub { font-size: 13.5px; fill: #4b6358; }
      .ator { font-size: 15px; font-weight: 700; fill: #0b2e24; }
      .ator2 { font-size: 12px; fill: #4b6358; }
      .msg { font-size: 13.5px; fill: #0b2e24; }
      .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .fase { font-size: 12.5px; font-weight: 700; letter-spacing: 1px; }
      .h1 { stroke: #e3f6ec; stroke-width: 6; paint-order: stroke; stroke-linejoin: round; }
      .h2 { stroke: #eef2f7; stroke-width: 6; paint-order: stroke; stroke-linejoin: round; }
      .h3 { stroke: #fef3e2; stroke-width: 6; paint-order: stroke; stroke-linejoin: round; }
      .vida { stroke: #9bb7aa; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .seta { stroke: #0b2e24; stroke-width: 1.8; fill: none; }
      .volta { stroke: #0b2e24; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="48" class="titulo">Caminho de um evento — do botão ao dashboard</text>
  <text x="40" y="74" class="sub">Exemplo: terceira pessoa chega (fila passa de 2 para 3)</text>

  <!-- fases -->
  <rect x="20" y="180" width="1360" height="196" fill="#e3f6ec"/>
  <rect x="20" y="380" width="1360" height="336" fill="#eef2f7"/>
  <rect x="20" y="720" width="1360" height="116" fill="#fef3e2"/>

  <!-- atores -->
  <g text-anchor="middle">
    <rect x="40" y="100" width="140" height="58" rx="10" fill="#e2f3f7" stroke="#0e7490" stroke-width="2"/>
    <text x="110" y="126" class="ator">Atendente</text><text x="110" y="145" class="ator2">botões</text>
    <rect x="225" y="100" width="150" height="58" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text x="300" y="126" class="ator">Núcleo 1</text><text x="300" y="145" class="ator2">loop()</text>
    <rect x="415" y="100" width="150" height="58" rx="10" fill="#e3f6ec" stroke="#047857" stroke-width="2"/>
    <text x="490" y="126" class="ator">SRAM</text><text x="490" y="145" class="ator2">buffer de eventos</text>
    <rect x="605" y="100" width="150" height="58" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text x="680" y="126" class="ator">Núcleo 0</text><text x="680" y="145" class="ator2">tarefaRede</text>
    <rect x="795" y="100" width="150" height="58" rx="10" fill="#eef2f7" stroke="#475569" stroke-width="2"/>
    <text x="870" y="126" class="ator">Broker MQTT</text><text x="870" y="145" class="ator2">hivemq.com</text>
    <rect x="985" y="100" width="150" height="58" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text x="1060" y="126" class="ator">Backend</text><text x="1060" y="145" class="ator2">Python</text>
    <rect x="1185" y="100" width="150" height="58" rx="10" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
    <text x="1260" y="126" class="ator">Dashboard</text><text x="1260" y="145" class="ator2">navegador</text>
  </g>

  <g class="vida">
    <line x1="110" y1="158" x2="110" y2="836"/>
    <line x1="300" y1="158" x2="300" y2="836"/>
    <line x1="490" y1="158" x2="490" y2="836"/>
    <line x1="680" y1="158" x2="680" y2="836"/>
    <line x1="870" y1="158" x2="870" y2="836"/>
    <line x1="1060" y1="158" x2="1060" y2="836"/>
    <line x1="1260" y1="158" x2="1260" y2="836"/>
  </g>

  <!-- rotulos das fases (por cima das linhas) -->
  <text x="32" y="198" class="fase h1" fill="#047857">NÚCLEO 1 · RESPOSTA LOCAL IMEDIATA</text>
  <text x="32" y="398" class="fase h2" fill="#475569">NÚCLEO 0 · REDE (MQTT)</text>
  <text x="32" y="738" class="fase h3" fill="#b45309">DASHBOARD · HTTP</text>

  <!-- 1 -->
  <line x1="110" y1="226" x2="298" y2="226" class="seta" marker-end="url(#seta)"/>
  <text x="205" y="218" class="msg h1" text-anchor="middle">aperta CHEGADA (GPIO 18)</text>
  <!-- 2 -->
  <path d="M300 256 H346 V280 H302" class="seta" marker-end="url(#seta)"/>
  <text x="356" y="272" class="msg h1">debounce 50 ms · valida · fila = 3</text>
  <!-- 3 -->
  <line x1="300" y1="314" x2="488" y2="314" class="seta" marker-end="url(#seta)"/>
  <text x="395" y="306" class="msg h1" text-anchor="middle">grava o Evento (mutex)</text>
  <!-- 4 -->
  <path d="M300 336 H346 V360 H302" class="seta" marker-end="url(#seta)"/>
  <text x="356" y="352" class="msg h1">LCD "Fila:03" (I²C) + LED verde</text>

  <!-- 5 -->
  <line x1="680" y1="428" x2="492" y2="428" class="seta" marker-end="url(#seta)"/>
  <text x="585" y="420" class="msg h2" text-anchor="middle">lê eventos pendentes</text>
  <!-- 6 -->
  <line x1="680" y1="474" x2="868" y2="474" class="seta" marker-end="url(#seta)"/>
  <text x="775" y="466" class="msg h2" text-anchor="middle">publish fila/evento</text>
  <!-- 7 -->
  <line x1="870" y1="520" x2="1058" y2="520" class="seta" marker-end="url(#seta)"/>
  <text x="965" y="512" class="msg h2" text-anchor="middle">entrega o evento</text>
  <!-- 8 -->
  <path d="M1060 548 H1106 V572 H1062" class="seta" marker-end="url(#seta)"/>
  <text x="1116" y="564" class="msg h2">grava CSV · recalcula a espera</text>
  <!-- 9 -->
  <line x1="1060" y1="610" x2="872" y2="610" class="seta" marker-end="url(#seta)"/>
  <text x="965" y="602" class="msg h2" text-anchor="middle">publish fila/previsao</text>
  <!-- 10 -->
  <line x1="870" y1="652" x2="682" y2="652" class="seta" marker-end="url(#seta)"/>
  <text x="775" y="644" class="msg h2" text-anchor="middle">entrega a previsão</text>
  <!-- 11 -->
  <line x1="680" y1="694" x2="302" y2="694" class="volta" marker-end="url(#seta)"/>
  <text x="490" y="686" class="msg h2" text-anchor="middle">pede para redesenhar → LCD "Esp~18m IA~16m"</text>

  <!-- 12 -->
  <line x1="1260" y1="772" x2="1062" y2="772" class="seta" marker-end="url(#seta)"/>
  <text x="1160" y="764" class="msg h3" text-anchor="middle">GET /api/estado (a cada 2 s)</text>
  <!-- 13 -->
  <line x1="1060" y1="812" x2="1258" y2="812" class="volta" marker-end="url(#seta)"/>
  <text x="1160" y="804" class="msg h3" text-anchor="middle">JSON: fila, espera, concluídos</text>

  <!-- numeros -->
  <g text-anchor="middle">
    <circle cx="96" cy="226" r="11" fill="#0e7490"/><text x="96" y="230" class="num">1</text>
    <circle cx="286" cy="256" r="11" fill="#047857"/><text x="286" y="260" class="num">2</text>
    <circle cx="286" cy="314" r="11" fill="#047857"/><text x="286" y="318" class="num">3</text>
    <circle cx="286" cy="348" r="11" fill="#047857"/><text x="286" y="352" class="num">4</text>
    <circle cx="694" cy="428" r="11" fill="#475569"/><text x="694" y="432" class="num">5</text>
    <circle cx="666" cy="474" r="11" fill="#475569"/><text x="666" y="478" class="num">6</text>
    <circle cx="856" cy="520" r="11" fill="#475569"/><text x="856" y="524" class="num">7</text>
    <circle cx="1046" cy="560" r="11" fill="#475569"/><text x="1046" y="564" class="num">8</text>
    <circle cx="1074" cy="610" r="11" fill="#475569"/><text x="1074" y="614" class="num">9</text>
    <circle cx="884" cy="652" r="11" fill="#475569"/><text x="884" y="656" class="num">10</text>
    <circle cx="694" cy="694" r="11" fill="#475569"/><text x="694" y="698" class="num">11</text>
    <circle cx="1274" cy="772" r="11" fill="#b45309"/><text x="1274" y="776" class="num">12</text>
    <circle cx="1046" cy="812" r="11" fill="#b45309"/><text x="1046" y="816" class="num">13</text>
  </g>

  <text x="40" y="866" class="sub" font-size="14">Passos 1 a 4 acontecem na hora, mesmo sem internet. Do clique até a previsão aparecer no LCD (passos 1 a 11): até 1 s no teste.</text>
  <text x="40" y="888" class="sub" font-size="14">Os dois núcleos só conversam pelo buffer na SRAM (protegido por mutex) e por uma flag de "redesenhar a tela".</text>
</svg>
